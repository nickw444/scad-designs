[project]
name = "scad-designs-tools"
version = "0.1.0"
description = "Shared CAD tooling and artifact regeneration for this repository"
requires-python = ">=3.13,<3.15"
dependencies = [
  "build123d==0.13.0",
  "trimesh>=4.0",
  "numpy>=2.0",
  "matplotlib>=3.9",
  "rtree>=1.0",
  "scipy>=1.11",
  "CairoSVG>=2.7",
  "Pillow>=10.0",
]

[project.scripts]
regen = "tools.regenerate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
